name: testes

on:
  push:
  pull_request:

permissions:
  contents: read

# Imagem fixa, e não ubuntu-latest: a suíte depende do sh (dash), do awk, do jq e do
# python3 que vêm nela, e o rótulo latest troca de versão sem aviso no repositório.
jobs:
  testar:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # jq e python3 já vêm na imagem
      - run: bash scripts/testar.sh

  # Windows é onde o plugin mais roda (Git Bash, jq que grava CRLF, caminho longo). Em
  # observação até uma sequência de execuções verdes: continue-on-error não reprova o push.
  # Depois, tire a linha.
  testar-windows:
    runs-on: windows-2025
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: jq --version && python --version && awk --version | head -n 1
      - run: bash scripts/testar.sh

  diagramas:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund mermaid@11.4.1 jsdom@25.0.1
      - run: node .github/scripts/validar-mermaid.mjs $(git ls-files '*.md')
